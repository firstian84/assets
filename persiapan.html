<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review</title>
  <style>
    :root {
      --primary: #b81414; /* Imperial Red */
      --primary-light: #fdf2f2; /* Soft Red Tint */
      --accent: #d4af37; /* Metallic Gold */
      --bg: #1a0505;
      --text: #2c221e;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(184, 20, 20, 0.15);
      --radius: 12px;
      --glow-color: rgba(212, 175, 55, 0.7); /* Gold Glow */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://raw.githubusercontent.com/firstian84/assets/main/IMG_20261018_104336_820.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      line-height: 1.5;
      padding: 12px;
      min-height: 100vh;
      transition: background 0.5s ease;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px 10px;
      border-bottom: 2px solid var(--accent);
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    header h1 {
      color: var(--primary);
      font-size: clamp(1.3rem, 4vw, 2.1rem);
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.8), 0 0 15px var(--glow-color);
      animation: pulseGlow 3s infinite alternate ease-in-out;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    @keyframes pulseGlow {
      0% {
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.6), 0 0 10px var(--glow-color);
      }
      100% {
        text-shadow: 0 0 15px rgba(212, 175, 55, 1), 0 0 25px var(--primary), 0 0 35px var(--accent);
      }
    }

    .budget-container {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15), inset 0 0 10px rgba(212, 175, 55, 0.25);
      margin-bottom: 18px;
      transition: all 0.4s ease;
      border: 1.5px solid var(--accent);
    }

    .budget-container:hover {
      box-shadow: 0 8px 20px rgba(184, 20, 20, 0.25), 0 0 20px var(--glow-color);
    }

    .budget-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .budget-table th, 
    .budget-table td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #e6d2bc;
      vertical-align: middle;
      font-size: 0.88rem;
    }

    .budget-table th {
      background-color: var(--primary-light);
      color: var(--primary);
      border-bottom: 2px solid var(--accent);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .budget-table col.col-desc { width: 55%; }
    .budget-table col.col-price { width: 45%; }

    .budget-table input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #d4af37;
      border-radius: 6px;
      font-size: 0.88rem;
      background: var(--white);
      transition: all 0.3s ease;
      outline: none;
      color: var(--text);
      text-align: right;
    }

    .budget-table input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--glow-color);
      background-color: #fff9f0;
    }

    .btn-venue-link {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: block;
      width: 100%;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .btn-venue-link:hover {
      background-color: var(--primary-light);
    }

    .btn-venue-link strong {
      font-size: 0.9rem;
    }

    .btn-venue-link span {
      font-size: 0.72rem;
      color: #665;
      font-weight: normal;
      display: block;
      margin-top: 2px;
    }

    .total-box {
      margin-top: 18px;
      background: linear-gradient(135deg, #b81414, #800e0e);
      color: var(--white);
      padding: 14px 16px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid var(--accent);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .saldo-box {
      margin-top: 10px;
      background: linear-gradient(135deg, #125c48, #0a382c);
      color: var(--white);
      padding: 12px 16px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      font-weight: bold;
      border: 1px solid var(--accent);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .total-amount {
      color: #ffd700;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }

    .saldo-input-wrapper {
      width: 55%;
    }

    .saldo-input-wrapper input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      background: var(--white);
      color: #125c48;
      text-align: right;
      outline: none;
      transition: all 0.3s ease;
    }

    .saldo-input-wrapper input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      background-color: #f0faf5;
    }

    .kerja-update-container {
      background: rgba(31, 13, 13, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 15px;
      margin-top: 10px;
      color: var(--white);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .kerja-update-container h3 {
      color: #ffd700;
      font-size: 1rem;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
      padding-bottom: 6px;
    }

    .kerja-item-group {
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .kerja-item-group label {
      display: block;
      font-size: 0.85rem;
      color: #ffd700;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .kerja-inputs-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .kerja-inputs-row:last-child {
      margin-bottom: 0;
    }

    .input-link {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 0.82rem;
      background: var(--white);
      color: var(--text);
      outline: none;
    }

    .preview-thumbnail-container {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--accent);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .preview-thumbnail-container:hover {
      transform: scale(1.08);
    }

    .preview-thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .glow-update {
      animation: flashGlow 0.8s ease-out;
    }

    @keyframes flashGlow {
      0% {
        transform: scale(1.08);
        color: #ff4d4d;
      }
      100% {
        transform: scale(1);
        color: #ffd700;
      }
    }

    .sync-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 10px;
    }

    .sync-status {
      font-size: 0.78rem;
      color: #ffd700;
      font-weight: 600;
      flex: 1;
    }

    .sync-status span span.coord-link {
      color: #64ffda;
      text-decoration: underline;
      cursor: pointer;
    }
    .sync-status span span.coord-link:hover {
      color: #1de9b6;
    }

    .btn-update-upstash {
      background: linear-gradient(135deg, #b81414, #900a0a);
      color: #ffd700;
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    .btn-update-upstash:active {
      transform: scale(0.96);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(26, 5, 5, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-content {
      background-color: var(--white);
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      padding: 18px;
      position: relative;
      border: 1.5px solid var(--accent);
    }

    .close-modal {
      position: absolute;
      right: 15px;
      top: 12px;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      cursor: pointer;
      border: none;
      background: none;
      z-index: 10;
    }

    .link-list {
      list-style: none;
      margin-bottom: 12px;
    }

    .link-list li {
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary-light);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #f0d5d5;
      gap: 8px;
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .link-thumb {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      background-color: #fff;
      flex-shrink: 0;
      border: 1px solid var(--accent);
    }

    .link-list a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
      font-size: 0.8rem;
    }

    .btn-delete-link {
      background: #b81414;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .add-link-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .add-link-form input {
      flex: 1;
      padding: 8px 10px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      background: var(--white);
      color: var(--text);
    }

    .btn-add {
      background: linear-gradient(135deg, #b81414, #800e0e);
      color: #ffd700;
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      .budget-container {
        padding: 12px 10px;
      }
      .sync-wrapper {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .btn-update-upstash {
        width: 100%;
      }
      .saldo-input-wrapper {
        width: 60%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="mainTitle">Review PROSES NIKAH KITA</h1>
    </header>

    <!-- TABEL BUDGET TAMBAHAN KECIL PERTAMA -->
    <div class="budget-container">
      <table class="budget-table">
        <colgroup>
          <col class="col-desc">
          <col class="col-price">
        </colgroup>
        <thead>
          <tr>
            <th>BUDGET TAMBAHAN KECIL</th>
            <th style="text-align: right;">+(Rp)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <button class="btn-venue-link" onclick="openVenueModal()">
                <strong>DANA MASUK</strong>
                <span>🔗 Galeri & vendor</span>
              </button>
            </td>
            <td><input type="text" class="price-input" data-id="venue" value="35.000.000" oninput="formatNumberInput(this); handleInput()"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- TABEL BUDGET UTAMA -->
    <div class="budget-container">
      <table class="budget-table">
        <colgroup>
          <col class="col-desc">
          <col class="col-price">
        </colgroup>
        <tbody>
          <tr>
            <td>
              <strong>BUDGET UTAMA</strong>
            </td>
            <td><input type="text" class="price-input" data-id="tambahan_kedua" value="0" oninput="formatNumberInput(this); handleInput()"></td>
          </tr>
        </tbody>
      </table>

      <!-- KOTAK TOTAL DANA -->
      <div class="total-box">
        <span>TOTAL DANA:</span>
        <span class="total-amount" id="grandTotal">Rp 0</span>
      </div>
      
      <!-- KOTAK TARGET -->
      <div class="total-box">
        <span>TARGET:</span>
        <span class="total-amount">Rp 292.000.000</span>
      </div>

      <!-- KOTAK REALTIME SALDO -->
      <div class="saldo-box" id="saldoBox">
        <span>REALTIME SALDO:</span>
        <div class="saldo-input-wrapper">
          <input type="text" class="price-input" data-id="realtime_saldo" value="0" oninput="formatNumberInput(this); handleInput()">
        </div>
      </div>

      <!-- KELOMPOK KERJA UPDATE: BESAR, SEDANG, KECIL -->
      <div class="kerja-update-container">
        <h3>📋 KERJA UPDATE</h3>
        
        <!-- Kerja Update Besar (3 Input) -->
        <div class="kerja-item-group">
          <label>Besar potensi keuntungan 400-500juta</label>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlBesar1" placeholder="URL 1 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlBesar1', 'thumbBesar1')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlBesar1').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbBesar1" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlBesar2" placeholder="URL 2 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlBesar2', 'thumbBesar2')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlBesar2').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbBesar2" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlBesar3" placeholder="URL 3 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlBesar3', 'thumbBesar3')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlBesar3').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbBesar3" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
        </div>

        <!-- Kerja Update Sedang (3 Input) -->
        <div class="kerja-item-group">
          <label>Sedang potensi keuntungan 500ribu-30juta</label>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlSedang1" placeholder="URL 1 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlSedang1', 'thumbSedang1')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlSedang1').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbSedang1" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlSedang2" placeholder="URL 2 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlSedang2', 'thumbSedang2')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlSedang2').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbSedang2" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlSedang3" placeholder="URL 3 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlSedang3', 'thumbSedang3')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlSedang3').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbSedang3" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
        </div>

        <!-- Kerja Update Kecil (7 Input) -->
        <div class="kerja-item-group">
          <label>Kecil potensi keuntungan 50ribu-500ribu</label>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil1" placeholder="URL 1 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil1', 'thumbKecil1')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil1').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil1" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil2" placeholder="URL 2 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil2', 'thumbKecil2')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil2').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil2" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil3" placeholder="URL 3 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil3', 'thumbKecil3')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil3').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil3" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil4" placeholder="URL 4 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil4', 'thumbKecil4')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil4').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil4" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil5" placeholder="URL 5 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil5', 'thumbKecil5')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil5').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil5" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil6" placeholder="URL 6 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil6', 'thumbKecil6')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil6').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil6" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
          <div class="kerja-inputs-row">
            <input type="text" class="input-link" id="inputUrlKecil7" placeholder="URL 7 (Gambar/Link)..." oninput="handleInput(); updateThumbnail('inputUrlKecil7', 'thumbKecil7')">
            <div class="preview-thumbnail-container" onclick="handlePreviewClick(document.getElementById('inputUrlKecil7').value)" title="Klik untuk preview gambar atau buka link">
              <img id="thumbKecil7" src="" alt="Img" onerror="this.src='https://via.placeholder.com/32?text=IMG'">
            </div>
          </div>
        </div>
      </div>

      <!-- BAGIAN STATUS & TOMBOL UPDATE MANUAL -->
      <div class="sync-wrapper">
        <div class="sync-status" id="syncStatus">Memuat data dari Upstash...</div>
        <button class="btn-update-upstash" onclick="manualSaveToUpstash()">Update</button>
      </div>
    </div>
  </div>

  <!-- MODAL POPUP VENUE -->
  <div class="modal" id="venueModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeVenueModal()">&times;</button>
      <h4 style="margin-bottom: 12px; color: var(--primary); font-size: 1rem;">RINCIAN</h4>
      <ul class="link-list" id="venueLinkList"></ul>

      <div class="add-link-form">
        <input type="url" id="newLinkUrl" placeholder="Masukkan URL (https://...)">
        <button class="btn-add" onclick="addNewLink()">Tambah pemasukan/pengeluaran</button>
      </div>
    </div>
  </div>

  <!-- MODAL POPUP PREVIEW GAMBAR -->
  <div class="modal" id="imageModal">
    <div class="modal-content" style="max-width: 600px; text-align: center; background: #1a0505;">
      <button class="close-modal" onclick="closeImageModal()">&times;</button>
      <h4 style="margin-bottom: 12px; color: #ffd700; font-size: 1rem;">Preview Gambar / Link</h4>
      <div style="max-height: 70vh; overflow: hidden; display: flex; justify-content: center; align-items: center;">
        <img id="modalPreviewImg" src="" alt="Preview" style="max-width: 100%; max-height: 65vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--accent);" onerror="this.style.display='none'">
      </div>
    </div>
  </div>

  <!-- MODAL POPUP GOOGLE MAPS -->
  <div class="modal" id="mapModal">
    <div class="modal-content" style="max-width: 700px; background: #1a0505;">
      <button class="close-modal" onclick="closeMapModal()">&times;</button>
      <h4 style="margin-bottom: 12px; color: #ffd700; font-size: 1rem; text-align: center;">Lokasi Update (Google Maps)</h4>
      <div style="width: 100%; height: 400px; border-radius: 8px; overflow: hidden; border: 1px solid var(--accent);">
        <iframe id="googleMapIframe" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT & UPSTASH INTEGRATION -->
  <script>
    const UPSTASH_CONFIG = {
        URL: "https://enabled-crayfish-71186.upstash.io",
        TOKEN: "gQAAAAAAARYSAAIncDE2MzUzMjQ5Mzg2N2E0YzU2OTUxODJjZWNmY2E2NzkyMXAxNzExODY",
        PREFIX: "persiapan_nikah"
    };

    let saveTimeout = null;

    // Koordinat Default (Contoh: Jakarta Selatan / Lokasi Anda)
    let currentCoords = { lat: -6.261492, lng: 106.810600 };

    let venueLinks = [
      { name: "https://www.bridestory.com", url: "https://www.bridestory.com" },
      { name: "https://www.weddingmarket.com", url: "https://www.weddingmarket.com" }
    ];

    const COLOR_PALETTES = [
      { primary: "#b81414", glow: "rgba(212, 175, 55, 0.7)", light: "#fdf2f2" }, 
      { primary: "#125c48", glow: "rgba(212, 175, 55, 0.7)", light: "#eaf3f0" },  
      { primary: "#8c1c1c", glow: "rgba(255, 140, 0, 0.7)", light: "#fbf0f0" },    
      { primary: "#a67c00", glow: "rgba(184, 20, 20, 0.7)", light: "#fcf8eb" }    
    ];

    function updateDynamicTheme(totalValue) {
      let index = Math.floor((totalValue / 50000000) % COLOR_PALETTES.length);
      let theme = COLOR_PALETTES[index];

      document.documentElement.style.setProperty('--primary', theme.primary);
      document.documentElement.style.setProperty('--glow-color', theme.glow);
      document.documentElement.style.setProperty('--primary-light', theme.light);
    }

    function formatNumberInput(input) {
      let value = input.value.replace(/[^,\d]/g, '').toString();
      let split = value.split(',');
      let sisa = split[0].length % 3;
      let rupiah = split[0].substr(0, sisa);
      let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

      if (ribuan) {
        let separator = sisa ? '.' : '';
        rupiah += separator + ribuan.join('.');
      }

      input.value = rupiah;
    }

    function getRawValue(val) {
      if (!val) return 0;
      return parseFloat(val.toString().replace(/\./g, '')) || 0;
    }

    function updateThumbnail(inputId, thumbId) {
      const urlVal = document.getElementById(inputId).value.trim();
      const thumbEl = document.getElementById(thumbId);
      if (urlVal) {
        let formattedUrl = urlVal;
        if (!/^https?:\/\//i.test(formattedUrl)) {
          formattedUrl = 'https://' + formattedUrl;
        }
        thumbEl.src = formattedUrl;
      } else {
        thumbEl.src = '';
      }
    }

    function isImageFile(url) {
      if (!url) return false;
      const imageExtensions = /\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i;
      return imageExtensions.test(url) || url.includes('images') || url.includes('usercontent');
    }

    function handlePreviewClick(url) {
      if (!url) {
        alert('URL belum diisi!');
        return;
      }
      let formattedUrl = url.trim();
      if (!/^https?:\/\//i.test(formattedUrl)) {
        formattedUrl = 'https://' + formattedUrl;
      }

      if (isImageFile(formattedUrl)) {
        openImageModal(formattedUrl);
      } else {
        window.open(formattedUrl, '_blank');
      }
    }

    function openVenueModal() {
      document.getElementById('venueModal').style.display = 'flex';
      renderVenueLinks();
    }

    function closeVenueModal() {
      document.getElementById('venueModal').style.display = 'none';
    }

    function openImageModal(imgUrl) {
      const modalImg = document.getElementById('modalPreviewImg');
      modalImg.style.display = 'block';
      modalImg.src = imgUrl;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function openMapModal(lat, lng) {
      const iframe = document.getElementById('googleMapIframe');
      iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
      document.getElementById('mapModal').style.display = 'flex';
    }

    function closeMapModal() {
      document.getElementById('mapModal').style.display = 'none';
      document.getElementById('googleMapIframe').src = '';
    }

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch (e) {
        return 'https://via.placeholder.com/40';
      }
    }

    function renderVenueLinks() {
      const listEl = document.getElementById('venueLinkList');
      listEl.innerHTML = '';
      if (venueLinks.length === 0) {
        listEl.innerHTML = '<li style="justify-content:center; color:#777; font-size: 0.8rem;">Belum ada link tersimpan.</li>';
        return;
      }
      venueLinks.forEach((link, index) => {
        const iconUrl = getFaviconUrl(link.url);
        listEl.innerHTML += `
          <li>
            <div class="link-info">
              <img src="${iconUrl}" class="link-thumb" alt="thumbnail" onerror="this.src='https://via.placeholder.com/40'">
              <a href="${link.url}" target="_blank">${link.url}</a>
            </div>
            <button class="btn-delete-link" onclick="deleteLink(${index})">Hapus</button>
          </li>
        `;
      });
    }

    function addNewLink() {
      const urlInput = document.getElementById('newLinkUrl');
      let urlValue = urlInput.value.trim();

      if (!urlValue) {
        alert('Mohon masukkan URL!');
        return;
      }

      if (!/^https?:\/\//i.test(urlValue)) {
        urlValue = 'https://' + urlValue;
      }

      venueLinks.push({ name: urlValue, url: urlValue });
      urlInput.value = '';

      renderVenueLinks();
      handleInput(); 
    }

    function deleteLink(index) {
      venueLinks.splice(index, 1);
      renderVenueLinks();
      handleInput(); 
    }

    function calculateTotal() {
      let danaMasuk = getRawValue(document.querySelector('[data-id="venue"]').value);
      let budgetUtama = getRawValue(document.querySelector('[data-id="tambahan_kedua"]').value);
      
      let total = danaMasuk + budgetUtama;

      const formattedTotal = new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(total);

      const totalEl = document.getElementById('grandTotal');
      
      if (totalEl.innerText !== formattedTotal) {
        totalEl.innerText = formattedTotal;
        totalEl.classList.remove('glow-update');
        void totalEl.offsetWidth; 
        totalEl.classList.add('glow-update');
      }

      updateDynamicTheme(total);
    }

    // Helper untuk format tanggal, jam, dan koordinat GPS
    function getCurrentTimestampWithCoord() {
      const now = new Date();
      const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('id-ID', optionsDate);
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      const lat = currentCoords.lat.toFixed(6);
      const lng = currentCoords.lng.toFixed(6);

      return `${dateStr}, ${timeStr} | <span class="coord-link" onclick="openMapModal(${lat}, ${lng})" title="Klik untuk buka Peta">📍 ${lat}, ${lng}</span>`;
    }

    // Ambil lokasi GPS perangkat jika diizinkan
    function fetchDeviceLocation() {
      return new Promise((resolve) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              currentCoords.lat = position.coords.latitude;
              currentCoords.lng = position.coords.longitude;
              resolve(true);
            },
            (error) => {
              console.warn("GPS tidak diizinkan atau gagal, menggunakan koordinat tersimpan/default.", error);
              resolve(false);
            },
            { timeout: 8000, maximumAge: 60000 }
          );
        } else {
          resolve(false);
        }
      });
    }

    async function loadFromUpstash() {
      fetchDeviceLocation();
      const statusEl = document.getElementById('syncStatus');
      try {
        const response = await fetch(`${UPSTASH_CONFIG.URL}/get/${UPSTASH_CONFIG.PREFIX}_data`, {
          headers: {
            Authorization: `Bearer ${UPSTASH_CONFIG.TOKEN}`
          }
        });
        const result = await response.json();

        if (result.result) {
          const data = JSON.parse(result.result);

          document.querySelectorAll('.price-input').forEach(input => {
            const id = input.getAttribute('data-id');
            if (data[id] !== undefined) {
              input.value = Number(data[id]).toLocaleString('id-ID');
            }
          });

          for (let i = 1; i <= 3; i++) {
            if (data[`kerja_besar_url${i}`] !== undefined) {
              document.getElementById(`inputUrlBesar${i}`).value = data[`kerja_besar_url${i}`];
              updateThumbnail(`inputUrlBesar${i}`, `thumbBesar${i}`);
            }
            if (data[`kerja_sedang_url${i}`] !== undefined) {
              document.getElementById(`inputUrlSedang${i}`).value = data[`kerja_sedang_url${i}`];
              updateThumbnail(`inputUrlSedang${i}`, `thumbSedang${i}`);
            }
          }

          // Loop untuk 7 input Kecil
          for (let i = 1; i <= 7; i++) {
            if (data[`kerja_kecil_url${i}`] !== undefined) {
              document.getElementById(`inputUrlKecil${i}`).value = data[`kerja_kecil_url${i}`];
              updateThumbnail(`inputUrlKecil${i}`, `thumbKecil${i}`);
            }
          }

          if (data.venueLinks) {
            venueLinks = data.venueLinks;
          }

          // Muat koordinat jika tersedia di database
          if (data.lat !== undefined && data.lng !== undefined) {
            currentCoords.lat = parseFloat(data.lat);
            currentCoords.lng = parseFloat(data.lng);
          }

          statusEl.innerHTML = `✅  <span style="font-weight: normal; opacity: 0.9;">(${getCurrentTimestampWithCoord()})</span>`;
          statusEl.style.color = '#125c48';
        } else {
          statusEl.innerText = 'Menggunakan data default.';
        }
      } catch (error) {
        console.error('Gagal memuat data:', error);
        statusEl.innerText = ' ❌ Gagal memuat data.';
        statusEl.style.color = '#b81414';
      }
      calculateTotal();
    }

    function handleInput() {
      calculateTotal();
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerText = 'Menyimpan perubahan...';
      statusEl.style.color = '#d4af37';

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        executeSaveToUpstash();
      }, 800);
    }

    // Tombol Update Manual: Mengambil koordinat GPS terbaru saat disentuh, lalu simpan ke Upstash
    async function manualSaveToUpstash() {
      clearTimeout(saveTimeout);
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerText = 'Mengambil koordinat GPS & memperbarui...';
      statusEl.style.color = '#ffd700';

      // Paksa ambil posisi GPS terbaru saat tombol Update ditekan
      await fetchDeviceLocation();
      
      await executeSaveToUpstash();
    }

    async function executeSaveToUpstash() {
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerText = 'Mengirim data ke Upstash...';

      const data = {};
      
      document.querySelectorAll('.price-input').forEach(input => {
        const id = input.getAttribute('data-id');
        data[id] = getRawValue(input.value);
      });

      for (let i = 1; i <= 3; i++) {
        data[`kerja_besar_url${i}`] = document.getElementById(`inputUrlBesar${i}`).value;
        data[`kerja_sedang_url${i}`] = document.getElementById(`inputUrlSedang${i}`).value;
      }

      // Simpan 7 input Kecil
      for (let i = 1; i <= 7; i++) {
        data[`kerja_kecil_url${i}`] = document.getElementById(`inputUrlKecil${i}`).value;
      }

      data.venueLinks = venueLinks;
      
      // Sertakan koordinat latitude & longitude ke payload data Upstash
      data.lat = currentCoords.lat;
      data.lng = currentCoords.lng;

      try {
        await fetch(`${UPSTASH_CONFIG.URL}/set/${UPSTASH_CONFIG.PREFIX}_data`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${UPSTASH_CONFIG.TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
        statusEl.innerHTML = `✅ Tersimpan <span style="font-weight: normal; opacity: 0.9;">(${getCurrentTimestampWithCoord()})</span>`;
        statusEl.style.color = '#125c48';
      } catch (error) {
        console.error('Gagal menyimpan:', error);
        statusEl.innerText = ' ❌ Gagal menyimpan';
        statusEl.style.color = '#b81414';
      }
    }

    window.onclick = function(event) {
      const modal = document.getElementById('venueModal');
      const imgModal = document.getElementById('imageModal');
      const mapModal = document.getElementById('mapModal');
      if (event.target === modal) {
        closeVenueModal();
      }
      if (event.target === imgModal) {
        closeImageModal();
      }
      if (event.target === mapModal) {
        closeMapModal();
      }
    }

    window.onload = loadFromUpstash;
  </script>

</body>
</html>
